# Local Studio 0.9 — same SQLite path as `npm run studio`.
# Postgres and Redis are unused by the Node control plane; keep them behind
# the extras profile so a default compose up matches a laptop clone.
#
#   docker compose -f docker/docker-compose.studio.yml up
#   docker compose -f docker/docker-compose.studio.yml --profile extras up

services:
  oas-studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.studio
    container_name: oas-studio-control-plane
    restart: unless-stopped
    ports:
      - "${OAS_STUDIO_PORT:-3456}:3456"
    environment:
      - NODE_ENV=production
      - OAS_STUDIO_PORT=3456
      - OAS_STUDIO_HOST=0.0.0.0
    volumes:
      - oas_studio_sqlite:/app/.oas-data
      - ../agents:/app/agents:ro
      - ../skills:/app/skills:ro
      - ../commands:/app/commands:ro
      - ../rules:/app/rules:ro
      - ../hooks:/app/hooks:ro
      - ../mcp-configs:/app/mcp-configs:ro

  postgres:
    profiles: ["extras"]
    image: pgvector/pgvector:pg16
    container_name: oas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oas
      POSTGRES_PASSWORD: oas_secret
      POSTGRES_DB: oas_enterprise
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - oas_pg_data:/var/lib/postgresql/data

  redis:
    profiles: ["extras"]
    image: redis:7-alpine
    container_name: oas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - oas_redis_data:/data

volumes:
  oas_studio_sqlite:
  oas_pg_data:
  oas_redis_data:
