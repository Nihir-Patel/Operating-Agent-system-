<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">OAS — Operating Agent Systems</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="100%" stop-color="#10062A"/>
    </linearGradient>
    <linearGradient id="oasGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer container with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Outer orbital ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#oasGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.6"/>
  
  <!-- Agent connection vertices -->
  <line x1="64" y1="26" x2="97" y2="45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="97" y1="45" x2="97" y2="83" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="97" y1="83" x2="64" y2="102" stroke="#A855F7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="64" y1="102" x2="31" y2="83" stroke="#A855F7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="31" y1="83" x2="31" y2="45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="31" y1="45" x2="64" y2="26" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Spokes to central agent core -->
  <line x1="64" y1="26" x2="64" y2="64" stroke="url(#oasGrad)" stroke-width="2.5"/>
  <line x1="97" y1="83" x2="64" y2="64" stroke="url(#oasGrad)" stroke-width="2.5"/>
  <line x1="31" y1="83" x2="64" y2="64" stroke="url(#oasGrad)" stroke-width="2.5"/>
  
  <!-- Outer node satellites -->
  <circle cx="64" cy="26" r="6.5" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="97" cy="45" r="5" fill="#3B82F6"/>
  <circle cx="97" cy="83" r="6.5" fill="#8B5CF6" filter="url(#nodeGlow)"/>
  <circle cx="64" cy="102" r="5" fill="#A855F7"/>
  <circle cx="31" cy="83" r="6.5" fill="#8B5CF6" filter="url(#nodeGlow)"/>
  <circle cx="31" cy="45" r="5" fill="#3B82F6"/>
  
  <!-- Central Core (AI Kernel) -->
  <circle cx="64" cy="64" r="14" fill="#090E1D" stroke="url(#oasGrad)" stroke-width="3" filter="url(#nodeGlow)"/>
  <circle cx="64" cy="64" r="6" fill="#F8FAFC"/>
</svg>
